name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build AoE2Wide
        run: msbuild .\src\AoE2Wide.csproj /m /p:Configuration=Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: AoE2Wide-Release
          path: src/bin/Release/**
          if-no-files-found: error
