name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 3.5 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory packages -NonInteractive

      - name: Build AoE2Wide
        run: >-
          msbuild .\src\AoE2Wide.csproj /m /p:Configuration=Release
          /p:TargetFrameworkRootPath="${{ github.workspace }}\packages\Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3\build"
          /p:TargetFrameworkProfile=

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: AoE2Wide-Release
          path: src/bin/Release/**
          if-no-files-found: error
